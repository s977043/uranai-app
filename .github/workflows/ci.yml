name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uranai_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uranai_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: PostgreSQL integration
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uranai_app

      - name: AI eval contracts
        run: npm run eval:contracts

      - name: Build
        run: npm run build
