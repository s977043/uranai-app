name: Documentation
description: ドキュメントの不足・誤記・整合性の改善
title: "[Docs] "
body:
  - type: input
    id: target
    attributes:
      label: 対象文書・リンク
      placeholder: docs/ または README のパス
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 現在の問題
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 修正案・検証方法
    validations:
      required: true
